# The Change Dispatch: approved sources
#
# FIRM RULE: every item must be free to read, or it doesn't appear.
# A source is listed here only if it is an established institution with
# editorial standards, peer review or moderation, dated items and named
# authors or institutions. No social media, blogs, press releases or
# content farms.
#
# Fields:
#   id            short unique name (letters, numbers, dashes)
#   name          name shown on the site
#   layer         research | preprint | institutional | analysis | news
#   kind          how it is fetched:
#                   rss        a news feed (list one or more "feeds";
#                              the first one that works is used)
#                   openalex   a journal, searched through OpenAlex
#                              (only open-access, non-retracted papers)
#                   osf        PsyArXiv preprints through the OSF API
#   window_days   how many days an item counts as current
#   enabled       true or false
#   needs_topic   true = keep only items that match a topic
#                 (always true for broad sources like newspapers)
#   note          anything worth remembering
#
# To add a source: copy an existing block, change the fields, save.
# The daily run reports which sources worked in docs/data/status.json
# and on the site's "About & sources" page.

sources:

