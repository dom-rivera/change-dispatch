  # Behavioral economics: two fully open-access, peer-reviewed journals.
  - id: jdm
    name: Judgment and Decision Making
    layer: research
    kind: openalex
    journal: Judgment and Decision Making
    issn: ["1930-2975"]
    window_days: 120
    needs_topic: true
    enabled: true
    note: "Fully open access; journal of the Society for Judgment and Decision Making and the European Association for Decision Making, published by Cambridge University Press. Only papers that match a topic appear."

  - id: jbpa
    name: Journal of Behavioral Public Administration
    layer: research
    kind: openalex
    journal: Journal of Behavioral Public Administration
    issn: ["2576-6465"]
    window_days: 120
    needs_topic: true
    enabled: true
    note: "Diamond open access (free to read and to publish); peer-reviewed; covers behavior in public organizations, including civil servants."

  # Targeted search: new articles about the core constructs in any
  # open-access journal listed in the Directory of Open Access Journals
  # (DOAJ), e.g. Frontiers in Psychology, PLOS ONE, SAGE Open, BMC
  # Psychology. Each article must also be about work or organizations.
  - id: core-search
    name: Research search (open-access journals)
    layer: research
    kind: openalex_search
    window_days: 60
    needs_topic: true
    require_work_context: true
    require_title_match: true   # the topic must appear in the title
    min_h_index: 30             # established journals only
    per_phrase: 25
    enabled: true
    queries:
      - readiness for change
      - change readiness
      - organizational readiness
      - commitment to change
      - change self-efficacy
      - change efficacy
      - occupational self-efficacy
      - openness to change
      - resistance to change
      - attitudes toward change
      - change cynicism
      - organizational change
      - change management
      - change fatigue
      - psychological safety
      - technostress
      - AI adoption employees
      # thin topics (added Nov 2026), same safeguards
      - attitudes toward AI
      - AI acceptance
      - technology acceptance employees
      - change leadership
      - transformational leadership
      - leadership development
      - remote work
      - hybrid work
      - reskilling
      - upskilling
      - job redesign
      - job crafting
      - nudge
      - status quo bias
      - loss aversion
      - behavioral insights
    exclude_journals: []
    note: "Safeguards: DOAJ-listed, English, free copy, not retracted, journal h-index 30+, topic in the title, about work or organizations. Each item is labeled with its own journal name."

  # Philippine research: new free-to-read articles by authors at Philippine
  # institutions, in established open-access journals (h-index 30+), on work topics.
  - id: ph-research
    name: Philippine research search
    layer: research
    kind: openalex_search
    window_days: 90
    needs_topic: true
    require_work_context: true
    require_title_match: true
    doaj_only: true
    extra_filter: "authorships.institutions.country_code:PH"
    min_h_index: 30
    per_phrase: 25
    enabled: true
    queries:
      - employees
      - workplace
      - organizational
      - work engagement
      - burnout
      - leadership
      - job satisfaction
      - teachers
      - nurses
      - self-efficacy
      - change
    note: "Same safeguards as the core search: DOAJ-listed, journal h-index 30+, free copy, English, topic in the title, about work. A first version (h-index 20, no DOAJ rule) let in uneven journals. Items are tagged Philippines & SE Asia."

  # ---------- Layer 2: preprints and working papers ----------

  - id: psyarxiv
    name: PsyArXiv
    layer: preprint
    kind: osf
    provider: psyarxiv
    window_days: 30
    needs_topic: true
    require_work_context: true
    enabled: true
    note: Labeled "Not yet peer-reviewed" on the site. Only papers about work or organizations are kept, because PsyArXiv covers all of psychology.

  - id: nber
    name: NBER Working Papers
    layer: preprint
    kind: rss
    feeds:
      - https://back.nber.org/rss/new.xml
    window_days: 30
    needs_topic: true
    date_fallback: first_seen
    enabled: true
    note: Feed verified. It lists new papers but has no dates, so each paper is dated the day it first appears. Working papers are not peer-reviewed.

