# Regional filter: tags items about the Philippines and Southeast Asia.
# Research papers are also tagged when an author is at an institution
# in one of the listed countries (country codes are ISO two-letter codes).
region:
  id: ph-sea
  name: Philippines & Southeast Asia
  match:
    - philippines
    - philippine
    - filipino
    - filipinos
    - manila
    - asean
    - southeast asia
    - south-east asia
    - indonesia
    - vietnam
    - viet nam
    - thailand
    - malaysia
    - singapore
    - cambodia
    - laos
    - myanmar
    - brunei
    - timor-leste
  author_countries: [PH, ID, VN, TH, MY, SG, KH, LA, MM, BN, TL]
