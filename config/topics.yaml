# The Change Dispatch: topics
#
# How matching works:
#   An item is kept only if its title or summary contains at least one
#   "match" phrase from any topic below. Matching ignores upper/lower case
#   and only matches whole words or phrases.
#   If an item also contains an "exclude" phrase for a topic, it is not
#   tagged with that topic.
#
#   "weak" phrases are broad words (like "automation") that only count
#   when the item is also about work or organizations, meaning it
#   contains one of the "work_context" words below.
#
# You can edit this file yourself: add or remove phrases, then save.
# Keep phrases specific. One-word phrases like "change" would match
# almost everything and flood the site.

work_context:
  - work
  - works
  - worker
  - workers
  - workplace
  - workplaces
  - working
  - employee
  - employees
  - employer
  - employers
  - employment
  - job
  - jobs
  - occupational
  - organization
  - organizations
  - organizational
  - organisation
  - organisations
  - organisational
  - company
  - companies
  - firm
  - firms
  - business
  - businesses
  - manager
  - managers
  - management
  - leader
  - leaders
  - leadership
  - team
  - teams
  - workforce
  - staff
  - career
  - careers
  - labor
  - labour
  - teacher
  - teachers
  - public sector
  - civil service

