name: Audit links

on:
  workflow_dispatch: {}     # run on demand: Actions → Audit links → Run workflow

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install --require-hashes -r requirements.txt
      - name: Open the live site in a real browser
        run: python scripts/check_live_page.py
      - name: Check every link, free access and the live site
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/audit_links.py
