name: Daily edition

on:
  schedule:
    # 22:17 UTC = 6:17 AM Manila time, every day
    - cron: "17 22 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Check the filtering rules
        run: python -m pytest -q tests

      - name: Fetch today's items
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch.py

      - name: Publish the new edition
        run: |
          git config user.name "dom-rivera"
          git config user.email "94301308+dom-rivera@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily edition $(date -u +%Y-%m-%d)"
            git push
          fi
