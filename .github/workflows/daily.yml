name: Daily edition

on:
  schedule:
    # GitHub sometimes delays or skips scheduled runs, so there are backups.
    # Extra runs are harmless: they just refresh the same day's edition.
    - cron: "17 22 * * *"   # 6:17 AM Manila (main run)
    - cron: "47 23 * * *"   # 7:47 AM Manila (backup)
    - cron: "17 2 * * *"    # 10:17 AM Manila (backup)
    - cron: "47 9 * * *"    # 5:47 PM Manila (evening refresh)
  workflow_dispatch: {}     # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write
  issues: write             # to open an alert issue when something goes wrong

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to exact commits (fingerprints), not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        # Every package and sub-package is checked against a recorded checksum.
        run: pip install --require-hashes -r requirements.txt

      - name: Check the filtering rules and citation format
        run: |
          python -m pytest -q tests
          node tests/apa.test.js

      - name: Fetch today's items
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch.py

      - name: Build the editor's notes (publishes notes scheduled for today)
        run: python scripts/build_notes.py

      - name: Publish the new edition
        run: |
          git config user.name "dom-rivera"
          git config user.email "94301308+dom-rivera@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Daily edition $(TZ=Asia/Manila date +%Y-%m-%d) ($(TZ=Asia/Manila date +%H:%M) Manila)"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Alert if sources are failing
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/health_alert.py
