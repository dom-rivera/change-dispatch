name: Daily edition

on:
  schedule:
    # 22:17 UTC = 6:17 AM Manila time, every day
    - cron: "17 22 * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to exact commits (fingerprints), not movable tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packages
        # Every package and sub-package is checked against a recorded checksum.
        run: pip install --require-hashes -r requirements.txt

      - name: Check the filtering rules
        run: python -m pytest -q tests

      - name: Fetch today's items
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/fetch.py

      - name: Publish the new edition
        run: |
          git config user.name "dom-rivera"
          git config user.email "94301308+dom-rivera@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes today."
          else
            git commit -m "Daily edition $(date -u +%Y-%m-%d)"
            git push
          fi
