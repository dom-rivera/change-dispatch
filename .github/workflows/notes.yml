name: Publish editor's notes

on:
  push:
    branches: [main]
    paths: ["notes/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-edition      # never runs at the same time as the daily edition
  cancel-in-progress: false

jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install packages
        run: pip install --require-hashes -r requirements.txt
      - name: Build the notes and the RSS feed
        run: |
          python scripts/build_notes.py
          python scripts/build_feed.py
      - name: Publish
        run: |
          git config user.name "dom-rivera"
          git config user.email "94301308+dom-rivera@users.noreply.github.com"
          git add docs/data/notes.json docs/feed.xml
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Editor's notes updated"
            git pull --rebase --autostash origin main
            git push
          fi
